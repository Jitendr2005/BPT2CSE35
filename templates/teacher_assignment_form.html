{% extends 'base.html' %}
{% block title %}Add/Edit Assignment - Student Performance Analyzer{% endblock %}
{% block content %}
<div class="container mt-5">
    <h2>{% if assignment_id %}Edit{% else %}Add{% endif %} Assignment for {{ student.username }}</h2>
    
    <form method="POST" class="mt-4">
        <div class="form-group">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" class="form-control" value="{{ form.title.data or '' }}" required>
        </div>
        
        <div class="form-group">
            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" class="form-control" value="{{ form.subject.data or '' }}" required>
        </div>
        
        <div class="form-group">
            <label for="due_date">Due Date:</label>
            <input type="date" id="due_date" name="due_date" class="form-control" value="{{ form.due_date.data or '' }}" required>
        </div>
        
        <div class="form-group">
            <label for="score">Score (optional):</label>
            <input type="number" id="score" name="score" class="form-control" step="0.01" value="{{ form.score.data or '' }}">
        </div>
        
        <div class="form-group">
            <label for="status">Status:</label>
            <select id="status" name="status" class="form-control" required>
                <option value="">Select Status</option>
                <option value="Pending" {% if form.status.data == 'Pending' %}selected{% endif %}>Pending</option>
                <option value="Submitted" {% if form.status.data == 'Submitted' %}selected{% endif %}>Submitted</option>
                <option value="Graded" {% if form.status.data == 'Graded' %}selected{% endif %}>Graded</option>
            </select>
        </div>
        
        <button type="submit" class="btn btn-success">{% if assignment_id %}Update{% else %}Add{% endif %} Assignment</button>
        <a href="{{ url_for('teacher_assignments', student_id=student._id) }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
